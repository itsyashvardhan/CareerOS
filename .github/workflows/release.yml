name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Windows NSIS (.exe) only ───────────────────────────────────────────────
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build and publish (NSIS only)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CareerOS ${{ github.ref_name }}
          releaseBody: |
            ## CareerOS ${{ github.ref_name }}

            | Platform | File |
            |---|---|
            | Windows | `CareerOS-*-Windows-x64.exe` |

            **Auto-update**: existing installs will be notified automatically.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      - name: Rename and upload NSIS exe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $ver = $env:TAG.TrimStart('v')
          $src = "src-tauri/target/release/bundle"

          $nsis = Get-ChildItem "$src/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            $dest = "CareerOS-$ver-Windows-x64.exe"
            Copy-Item $nsis.FullName $dest
            gh release upload $env:TAG $dest --clobber
          }

  # ── Finalize updater: sign .nsis.zip + generate latest.json ───────────────
  finalize-updater:
    needs: release-windows
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Download .nsis.zip from release
        run: |
          mkdir -p dist
          cd dist
          gh release download "$TAG" --pattern "*.nsis.zip*" --skip-existing 2>/dev/null || true
          ls -la

      - name: Sign update bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Secret is raw minisign file content; --private-key expects base64(full_file_content)
          ENCODED_KEY=$(printf '%s\n' "$TAURI_SIGNING_PRIVATE_KEY" | base64 -w 0)
          cd dist
          for f in *.nsis.zip; do
            [ -f "$f" ] || continue
            [ -f "${f}.sig" ] && { echo "  already signed: $f"; continue; }
            echo "  signing: $f"
            # Try with stored password first; fall back to empty password (key may have no passphrase)
            if TAURI_SIGNING_PRIVATE_KEY="$ENCODED_KEY" cargo tauri signer sign \
                --private-key "$ENCODED_KEY" \
                --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
                "$f" 2>/dev/null; then
              echo "  signed with stored password"
            elif TAURI_SIGNING_PRIVATE_KEY="$ENCODED_KEY" cargo tauri signer sign \
                --private-key "$ENCODED_KEY" \
                --password "" \
                "$f" 2>/dev/null; then
              echo "  signed with empty password"
            else
              echo "  ERROR: signing failed — check TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets"
              TAURI_SIGNING_PRIVATE_KEY="$ENCODED_KEY" cargo tauri signer sign \
                --private-key "$ENCODED_KEY" \
                --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
                "$f"
            fi
          done

      - name: Upload .sig file
        run: |
          cd dist
          for sig in *.sig; do
            [ -f "$sig" ] || continue
            gh release upload "$TAG" "$sig" --clobber
          done

      - name: Generate and upload latest.json
        run: |
          ver="${TAG#v}"
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          base_url="https://github.com/itsyashvardhan/CareerOS/releases/download/${TAG}"
          cd dist

          win=$(ls *.nsis.zip 2>/dev/null | grep -v '\.sig$' | head -1)
          if [ -z "$win" ] || [ ! -f "${win}.sig" ]; then
            echo "ERROR: no signed .nsis.zip found"; ls -la; exit 1
          fi

          sig=$(cat "${win}.sig")
          jq -n \
            --arg v "v$ver" \
            --arg d "$pub_date" \
            --arg u "$base_url/$win" \
            --arg s "$sig" \
            '{"version":$v,"notes":"","pub_date":$d,"platforms":{"windows-x86_64":{"url":$u,"signature":$s}}}' \
            > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber
