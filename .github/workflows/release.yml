name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Windows NSIS (.exe) only — builds, signs, uploads, generates latest.json
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@v2

      - name: Build Tauri app (NSIS and updater)
        shell: pwsh
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Normalize newlines to Unix LF and ensure trailing newline is kept for minisign parsing
          $cleanKey = $env:RAW_KEY.Replace("`r`n", "`n").Replace("`r", "`n")
          if (!$cleanKey.EndsWith("`n")) {
            $cleanKey += "`n"
          }
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($cleanKey)
          $env:TAURI_SIGNING_PRIVATE_KEY = [Convert]::ToBase64String($bytes)
          tauri build --bundles nsis
      - name: Upload installer, update bundle, and latest.json
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Create release if it doesn't exist
          $exists = gh release view $env:TAG 2>&1
          if ($exists -match "release not found" -or $LastExitCode -ne 0) {
            gh release create $env:TAG --title "CareerOS $env:TAG" --notes "Release $env:TAG" --draft=false --prerelease=false
          }
          $ver = $env:TAG.TrimStart('v')
          $src = "src-tauri/target/release/bundle/nsis"
          $baseUrl = "https://github.com/itsyashvardhan/CareerOS/releases/download/$($env:TAG)"

          # Upload renamed installer
          $exe = Get-ChildItem "$src" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            $dest = "CareerOS-$ver-Windows-x64.exe"
            Copy-Item $exe.FullName $dest
            gh release upload $env:TAG $dest --clobber
            Write-Host "Uploaded: $dest"
          }

          # Upload update bundle + its signature (both generated by tauri-action during build)
          # NOTE: -Filter "*.nsis.zip" silently fails on Windows (double-extension bug) — use Where-Object instead
          Write-Host "NSIS bundle directory contents:"; Get-ChildItem "$src" | Select-Object Name
          $zip = Get-ChildItem "$src" | Where-Object { $_.Name -like "*.nsis.zip" } | Select-Object -First 1
          $sig = if ($zip) { Get-Item "$($zip.FullName).sig" -ErrorAction SilentlyContinue } else { $null }

          if ($zip) {
            gh release upload $env:TAG $zip.FullName --clobber
            Write-Host "Uploaded: $($zip.Name)"
          }
          if ($sig) {
            gh release upload $env:TAG $sig.FullName --clobber
            Write-Host "Uploaded: $($sig.Name)"
          }

          # Generate latest.json from the signature tauri-action already created
          if ($zip -and $sig) {
            $sigContent = Get-Content $sig.FullName -Raw
            $pubDate = (Get-Date -Format "yyyy-MM-ddTHH:mm:ss.000Z" -AsUTC)
            $zipUrl = "$baseUrl/$($zip.Name)"
            $json = @{
              version = "v$ver"
              notes = ""
              pub_date = $pubDate
              platforms = @{
                "windows-x86_64" = @{
                  url = $zipUrl
                  signature = $sigContent.Trim()
                }
              }
            } | ConvertTo-Json -Depth 5
            $json | Out-File -FilePath "latest.json" -Encoding utf8NoBOM
            Write-Host "Generated latest.json:"
            Get-Content "latest.json"
            gh release upload $env:TAG latest.json --clobber
            Write-Host "Uploaded: latest.json"
          } else {
            Write-Host "WARNING: no .nsis.zip.sig found — latest.json not generated"
            Get-ChildItem "$src" | Select-Object Name
          }
