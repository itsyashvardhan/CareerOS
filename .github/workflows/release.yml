name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Desktop: Windows, macOS (ARM + Intel), Linux ───────────────────────────
  release-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            artifact_suffix: macOS-arm64
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            artifact_suffix: macOS-x64
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            artifact_suffix: Linux-x64
            rust_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ''
            artifact_suffix: Windows-x64
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CareerOS ${{ github.ref_name }}
          releaseBody: |
            ## CareerOS ${{ github.ref_name }}

            | Platform | File | Notes |
            |---|---|---|
            | Windows | `CareerOS-*-Windows-x64.exe` | **Recommended — supports auto-update** |
            | Windows | `CareerOS-*-Windows-x64.msi` | Manual install only, no auto-update |
            | macOS Apple Silicon | `CareerOS-*-macOS-arm64.dmg` | |
            | macOS Intel | `CareerOS-*-macOS-x64.dmg` | |
            | Linux | `CareerOS-*-Linux-x64.AppImage` | |
            | Linux | `CareerOS-*-Linux-x64.deb` | |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Rename Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $ver = $env:TAG.TrimStart('v')
          $src = "src-tauri/target/release/bundle"

          $nsis = Get-ChildItem "$src/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            $dest = "CareerOS-$ver-Windows-x64.exe"
            Copy-Item $nsis.FullName $dest
            gh release upload $env:TAG $dest --clobber
          }

      - name: Rename macOS artifacts
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SUFFIX: ${{ matrix.artifact_suffix }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          ver="${TAG#v}"
          dmg=$(find "src-tauri/target/${RUST_TARGET}/release/bundle/dmg" -name "*.dmg" 2>/dev/null | head -1)
          if [ -n "$dmg" ]; then
            dest="CareerOS-${ver}-${SUFFIX}.dmg"
            cp "$dmg" "$dest"
            gh release upload "$TAG" "$dest" --clobber
          fi

      - name: Rename Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ver="${TAG#v}"
          src="src-tauri/target/release/bundle"

          appimage=$(find "$src/appimage" -name "*.AppImage" 2>/dev/null | head -1)
          if [ -n "$appimage" ]; then
            dest="CareerOS-${ver}-Linux-x64.AppImage"
            cp "$appimage" "$dest"
            gh release upload "$TAG" "$dest" --clobber
          fi

          deb=$(find "$src/deb" -name "*.deb" 2>/dev/null | head -1)
          if [ -n "$deb" ]; then
            dest="CareerOS-${ver}-Linux-x64.deb"
            cp "$deb" "$dest"
            gh release upload "$TAG" "$dest" --clobber
          fi

  # ── Finalize updater: sign bundles + generate latest.json ──────────────────
  finalize-updater:
    needs: release-desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Download update bundles from release
        run: |
          mkdir -p dist
          cd dist
          gh release download "$TAG" --pattern "*.nsis.zip*" --skip-existing 2>/dev/null || true
          gh release download "$TAG" --pattern "*.app.tar.gz*" --skip-existing 2>/dev/null || true
          gh release download "$TAG" --pattern "*.AppImage.tar.gz*" --skip-existing 2>/dev/null || true
          ls -la

      - name: Sign any unsigned update bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd dist
          for f in *.nsis.zip *.app.tar.gz *.AppImage.tar.gz; do
            [ -f "$f" ] || continue
            [ -f "${f}.sig" ] && { echo "  already signed: $f"; continue; }
            echo "  signing: $f"
            cargo tauri signer sign \
              --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
              --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
              "$f"
          done

      - name: Upload any new .sig files
        run: |
          cd dist
          for sig in *.sig; do
            [ -f "$sig" ] || continue
            gh release upload "$TAG" "$sig" --clobber
          done

      - name: Generate and upload latest.json
        run: |
          ver="${TAG#v}"
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          base_url="https://github.com/itsyashvardhan/CareerOS/releases/download/${TAG}"
          cd dist

          platforms="{}"

          win=$(ls *.nsis.zip 2>/dev/null | grep -v '\.sig$' | head -1)
          if [ -n "$win" ] && [ -f "${win}.sig" ]; then
            sig=$(cat "${win}.sig")
            platforms=$(echo "$platforms" | jq --arg u "$base_url/$win" --arg s "$sig" \
              '. + {"windows-x86_64": {"url":$u,"signature":$s}}')
          fi

          mac_arm=$(ls 2>/dev/null *.app.tar.gz | grep -i aarch64 | head -1)
          if [ -n "$mac_arm" ] && [ -f "${mac_arm}.sig" ]; then
            sig=$(cat "${mac_arm}.sig")
            platforms=$(echo "$platforms" | jq --arg u "$base_url/$mac_arm" --arg s "$sig" \
              '. + {"darwin-aarch64": {"url":$u,"signature":$s}}')
          fi

          mac_x64=$(ls 2>/dev/null *.app.tar.gz | grep -i x86_64 | head -1)
          if [ -n "$mac_x64" ] && [ -f "${mac_x64}.sig" ]; then
            sig=$(cat "${mac_x64}.sig")
            platforms=$(echo "$platforms" | jq --arg u "$base_url/$mac_x64" --arg s "$sig" \
              '. + {"darwin-x86_64": {"url":$u,"signature":$s}}')
          fi

          lin=$(ls 2>/dev/null *.AppImage.tar.gz | grep -v '\.sig$' | head -1)
          if [ -n "$lin" ] && [ -f "${lin}.sig" ]; then
            sig=$(cat "${lin}.sig")
            platforms=$(echo "$platforms" | jq --arg u "$base_url/$lin" --arg s "$sig" \
              '. + {"linux-x86_64": {"url":$u,"signature":$s}}')
          fi

          echo "$platforms" | jq \
            --arg v "v$ver" --arg d "$pub_date" \
            '{"version":$v,"notes":"","pub_date":$d,"platforms":.}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber
