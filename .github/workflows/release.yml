name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:

  # ── Desktop: Windows, macOS (ARM + Intel), Linux ───────────────────────────
  release-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            artifact_suffix: macOS-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            artifact_suffix: macOS-x64
          - platform: ubuntu-22.04
            args: ''
            artifact_suffix: Linux-x64
          - platform: windows-latest
            args: ''
            artifact_suffix: Windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}

      - name: Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build and publish (creates/updates the release + latest.json)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CareerOS ${{ github.ref_name }}
          releaseBody: |
            ## CareerOS ${{ github.ref_name }}

            ### Install
            | Platform | File | Notes |
            |---|---|---|
            | Windows | `CareerOS-*-Windows-x64.exe` | **Recommended — supports auto-update** |
            | Windows | `CareerOS-*-Windows-x64.msi` | Manual install only, no auto-update |
            | macOS (Apple Silicon) | `CareerOS-*-macOS-arm64.dmg` | |
            | macOS (Intel) | `CareerOS-*-macOS-x64.dmg` | |
            | Linux | `CareerOS-*-Linux-x64.AppImage` | |
            | Linux | `CareerOS-*-Linux-x64.deb` | |
            | Android | `CareerOS-*-Android.apk` | |

            > **MSI users:** The MSI installer does not support auto-update. Please use the `.exe` installer for automatic updates.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # ── Rename artifacts to human-friendly names ──────────────────────────
      - name: Rename Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $src = "src-tauri/target/release/bundle"

          # NSIS installer (auto-update capable) — rename and re-upload
          $nsis = Get-ChildItem "$src/nsis" -Filter "*.exe" | Select-Object -First 1
          if ($nsis) {
            $dest = "CareerOS-$ver-Windows-x64.exe"
            Copy-Item $nsis.FullName $dest
            gh release upload ${{ github.ref_name }} $dest --clobber
          }

          # MSI (manual install only)
          $msi = Get-ChildItem "$src/msi" -Filter "*.msi" | Select-Object -First 1
          if ($msi) {
            $dest = "CareerOS-$ver-Windows-x64.msi"
            Copy-Item $msi.FullName $dest
            gh release upload ${{ github.ref_name }} $dest --clobber
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename macOS artifacts
        if: matrix.platform == 'macos-latest'
        run: |
          ver="${{ github.ref_name }}"
          ver="${ver#v}"
          suffix="${{ matrix.artifact_suffix }}"
          src="src-tauri/target/${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}/release/bundle/dmg"

          dmg=$(find "$src" -name "*.dmg" | head -1)
          if [ -n "$dmg" ]; then
            dest="CareerOS-${ver}-${suffix}.dmg"
            cp "$dmg" "$dest"
            gh release upload ${{ github.ref_name }} "$dest" --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          ver="${{ github.ref_name }}"
          ver="${ver#v}"
          src="src-tauri/target/release/bundle"

          appimage=$(find "$src/appimage" -name "*.AppImage" | head -1)
          if [ -n "$appimage" ]; then
            dest="CareerOS-${ver}-Linux-x64.AppImage"
            cp "$appimage" "$dest"
            gh release upload ${{ github.ref_name }} "$dest" --clobber
          fi

          deb=$(find "$src/deb" -name "*.deb" | head -1)
          if [ -n "$deb" ]; then
            dest="CareerOS-${ver}-Linux-x64.deb"
            cp "$deb" "$dest"
            gh release upload ${{ github.ref_name }} "$dest" --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Android ────────────────────────────────────────────────────────────────
  release-android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: release-desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK + NDK
        uses: android-actions/setup-android@v3

      - run: sdkmanager "ndk;27.0.12077973"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/careeros.keystore
            export TAURI_ANDROID_KEYSTORE=/tmp/careeros.keystore
            export TAURI_ANDROID_KEYSTORE_PASSWORD="$STORE_PASSWORD"
            export TAURI_ANDROID_KEY_ALIAS="$KEY_ALIAS"
            export TAURI_ANDROID_KEY_PASSWORD="$KEY_PASSWORD"
          fi
          cargo tauri android build --apk

      - name: Upload renamed APK
        run: |
          ver="${{ github.ref_name }}"
          ver="${ver#v}"
          apk=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -name "*.apk" | head -1)
          if [ -n "$apk" ]; then
            dest="CareerOS-${ver}-Android.apk"
            cp "$apk" "$dest"
            gh release upload ${{ github.ref_name }} "$dest" --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── iOS ────────────────────────────────────────────────────────────────────
  release-ios:
    permissions:
      contents: write
    runs-on: macos-latest
    needs: release-desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Import Apple certificate
        if: ${{ secrets.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ci-keychain-pass
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Build iOS IPA
        run: cargo tauri ios build --export-method app-store-connect 2>/dev/null || cargo tauri ios build

      - name: Upload renamed IPA
        run: |
          ver="${{ github.ref_name }}"
          ver="${ver#v}"
          ipa=$(find src-tauri/gen/apple/build/arm64 -name "*.ipa" | head -1)
          if [ -n "$ipa" ]; then
            dest="CareerOS-${ver}-iOS.ipa"
            cp "$ipa" "$dest"
            gh release upload ${{ github.ref_name }} "$dest" --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
