name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Desktop: Windows, macOS (ARM + Intel), Linux ───────────────────────────
  release-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            artifact_suffix: macOS-arm64
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            artifact_suffix: macOS-x64
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            artifact_suffix: Linux-x64
            rust_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ''
            artifact_suffix: Windows-x64
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: CareerOS ${{ github.ref_name }}
          releaseBody: |
            ## CareerOS ${{ github.ref_name }}

            | Platform | File | Notes |
            |---|---|---|
            | Windows | `CareerOS-*-Windows-x64.exe` | **Recommended — supports auto-update** |
            | Windows | `CareerOS-*-Windows-x64.msi` | Manual install only, no auto-update |
            | macOS Apple Silicon | `CareerOS-*-macOS-arm64.dmg` | |
            | macOS Intel | `CareerOS-*-macOS-x64.dmg` | |
            | Linux | `CareerOS-*-Linux-x64.AppImage` | |
            | Linux | `CareerOS-*-Linux-x64.deb` | |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Rename Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $ver = $env:TAG.TrimStart('v')
          $src = "src-tauri/target/release/bundle"

          $nsis = Get-ChildItem "$src/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            $dest = "CareerOS-$ver-Windows-x64.exe"
            Copy-Item $nsis.FullName $dest
            gh release upload $env:TAG $dest --clobber
          }

          $msi = Get-ChildItem "$src/msi" -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            $dest = "CareerOS-$ver-Windows-x64.msi"
            Copy-Item $msi.FullName $dest
            gh release upload $env:TAG $dest --clobber
          }

      - name: Rename macOS artifacts
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SUFFIX: ${{ matrix.artifact_suffix }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          ver="${TAG#v}"
          dmg=$(find "src-tauri/target/${RUST_TARGET}/release/bundle/dmg" -name "*.dmg" 2>/dev/null | head -1)
          if [ -n "$dmg" ]; then
            dest="CareerOS-${ver}-${SUFFIX}.dmg"
            cp "$dmg" "$dest"
            gh release upload "$TAG" "$dest" --clobber
          fi

      - name: Rename Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ver="${TAG#v}"
          src="src-tauri/target/release/bundle"

          appimage=$(find "$src/appimage" -name "*.AppImage" 2>/dev/null | head -1)
          if [ -n "$appimage" ]; then
            dest="CareerOS-${ver}-Linux-x64.AppImage"
            cp "$appimage" "$dest"
            gh release upload "$TAG" "$dest" --clobber
          fi

          deb=$(find "$src/deb" -name "*.deb" 2>/dev/null | head -1)
          if [ -n "$deb" ]; then
            dest="CareerOS-${ver}-Linux-x64.deb"
            cp "$deb" "$dest"
            gh release upload "$TAG" "$dest" --clobber
          fi
